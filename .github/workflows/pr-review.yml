name: PR Review Starter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-review-starter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print PR context
        run: |
          echo "Repo: ${{ github.repository }}"
          echo "PR #: ${{ github.event.pull_request.number }}"
          echo "Title: ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"

      - name: Gemini PR review summary
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (!process.env.GEMINI_API_KEY) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: "AI review skipped: `GEMINI_API_KEY` secret is not configured."
              });
              return;
            }

            if (!process.env.GEMINI_MODEL) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: "AI review skipped: `GEMINI_MODEL` repository variable is not configured."
              });
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );

            const MAX_FILES = 25;
            const MAX_PATCH_CHARS = 14000;
            const ignoredExt = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".lock", ".map"];

            let totalPatchChars = 0;
            const selected = [];

            for (const f of files) {
              if (selected.length >= MAX_FILES) break;

              const lower = f.filename.toLowerCase();
              const ignoreByExt = ignoredExt.some((ext) => lower.endsWith(ext));
              if (ignoreByExt) continue;
              if (!f.patch) continue;

              const nextSize = totalPatchChars + f.patch.length;
              if (nextSize > MAX_PATCH_CHARS) break;

              selected.push({
                filename: f.filename,
                status: f.status,
                additions: f.additions,
                deletions: f.deletions,
                patch: f.patch
              });
              totalPatchChars = nextSize;
            }

            // Parse a unified diff patch and return the set of new-file line numbers
            // that were added or modified (the only lines GitHub allows inline comments on).
            function parsePatch(patch) {
              const valid = new Set();
              let newLine = 0;
              for (const line of patch.split("\n")) {
                const hunk = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunk) { newLine = parseInt(hunk[1]) - 1; continue; }
                if (line.startsWith("+")) { newLine++; valid.add(newLine); }
                else if (line.startsWith(" ")) { newLine++; }
              }
              return valid;
            }

            for (const f of selected) f.validLines = parsePatch(f.patch);

            if (selected.length === 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: "AI review skipped: no suitable text diff found (or PR is too large/binary-only)."
              });
              return;
            }

            const changedText = selected.map((f) => [
              `FILE: ${f.filename}`,
              `STATUS: ${f.status} | +${f.additions} -${f.deletions}`,
              `CHANGED LINES: ${[...f.validLines].sort((a, b) => a - b).slice(0, 50).join(", ")}`,
              "PATCH:",
              f.patch
            ].join("\n")).join("\n\n---\n\n");

            const prompt = [
              "You are a senior code reviewer. Review this pull request diff.",
              "Focus on correctness, bugs, security, edge-cases, and test gaps.",
              "Do not invent details not present in the diff.",
              "",
              "Return ONLY a JSON object (no markdown fences, no extra text) with this structure:",
              '{ "summary": "<markdown with sections: ## Summary, ## Risks, ## Security Vulnerabilities, ## Suggested Tests, ## Optional Improvements>",',
              '  "inline": [ { "file": "<filename>", "line": <number>, "comment": "<specific feedback>" } ] }',
              "",
              "Rules for inline:",
              "- Only use line numbers from the CHANGED LINES list for the file",
              "- Only flag genuine bugs, security issues, or logic errors — skip style",
              "- Maximum 5 inline comments total; use [] if nothing significant",
              "",
              `PR title: ${pr.title}`,
              `PR author: ${pr.user.login}`,
              "",
              "Diff:",
              changedText
            ].join("\n");

            const model = process.env.GEMINI_MODEL;
            const endpoint =
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${process.env.GEMINI_API_KEY}`;

            const resp = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: {
                  temperature: 0.2,
                  maxOutputTokens: 1500
                }
              })
            });

            if (!resp.ok) {
              const errorText = await resp.text();
              if (resp.status === 404) {
                const listUrl =
                  `https://generativelanguage.googleapis.com/v1beta/models?key=${process.env.GEMINI_API_KEY}`;
                let hint = "";
                try {
                  const listResp = await fetch(listUrl);
                  if (listResp.ok) {
                    const listData = await listResp.json();
                    const available = (listData.models || [])
                      .filter((m) => Array.isArray(m.supportedGenerationMethods) &&
                        m.supportedGenerationMethods.includes("generateContent"))
                      .map((m) => m.name?.replace(/^models\//, ""))
                      .slice(0, 20);
                    if (available.length > 0) {
                      hint = ` Available generateContent models include: ${available.join(", ")}.`;
                    }
                  }
                } catch (e) {
                  core.warning(`ListModels lookup failed: ${e.message}`);
                }
                core.setFailed(
                  `Gemini model '${model}' is not available for generateContent.${hint} Update repository variable GEMINI_MODEL. Raw API error: ${errorText}`
                );
                return;
              }
              core.setFailed(`Gemini API request failed: ${resp.status} ${errorText}`);
              return;
            }

            const data = await resp.json();
            const rawText =
              data?.candidates?.[0]?.content?.parts
                ?.map((p) => p.text || "")
                .join("\n")
                .trim() || "";

            let summary = rawText || "Gemini returned an empty response.";
            let inlineComments = [];

            try {
              const cleaned = rawText.replace(/^```(?:json)?\s*/m, "").replace(/\s*```$/m, "").trim();
              const parsed = JSON.parse(cleaned);
              summary = parsed.summary || rawText;

              const lineSetByFile = {};
              for (const f of selected) lineSetByFile[f.filename] = f.validLines;

              inlineComments = (parsed.inline || [])
                .filter(c => c.file && c.line && c.comment && lineSetByFile[c.file]?.has(c.line))
                .slice(0, 5)
                .map(c => ({ path: c.file, line: c.line, side: "RIGHT", body: c.comment }));
            } catch (e) {
              core.warning(`Failed to parse Gemini JSON response: ${e.message}. Falling back to plain text.`);
            }

            const body = [
              "## AI PR Review (Gemini)",
              `- Model: \`${model}\``,
              `- Files reviewed: ${selected.length}/${files.length}`,
              `- Diff chars used: ${totalPatchChars}/${MAX_PATCH_CHARS}`,
              `- Inline comments: ${inlineComments.length}`,
              "",
              summary,
              "",
              "_Automated review assistant output. Verify before applying changes._"
            ].join("\n");

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: pr.number,
              body,
              event: "COMMENT",
              comments: inlineComments
            });
